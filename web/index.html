<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#1b0b2b"/>
  <meta name="description" content="فرار ۶۰ — بازی رایگان و سریع تعقیب و گریز در شهر ساحلی غروب. ۶۰ ثانیه از پلیس فرار کن و دوستات رو به چالش بکش!"/>
  <link rel="icon" href="./assets/logo.svg"><title>فرار ۶۰ | ESCAPE 60</title>
  <link rel="preload" href="./assets/fonts/vazirmatn-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/jersey-10-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body data-view="home">
  <main id="app">
    <canvas id="game" aria-label="شهر سه‌بعدی فرار ۶۰؛ با چپ و راست فرمان بده"></canvas>
    <div id="hurt" class="hurt" aria-hidden="true"></div>
    <span id="threat" class="threat" aria-hidden="true" hidden></span>

    <div id="overlay" class="overlay">
      <!-- MAIN MENU -->
      <section id="home" class="screen home">
        <header class="brand">
          <h1 class="logo"><img src="./assets/logo.svg" alt="ESCAPE 60 — فرار ۶۰" width="182" height="112"></h1>
          <p class="tagline">یک شهر. سه جان. شصت ثانیه برای فرار.</p>
        </header>
        <div class="dock">
          <p class="chip chip-daily" id="daily-label"></p>
          <button id="play" class="btn btn-primary btn-xl">
            <span class="btn-ico" data-icon="play"></span>
            <span class="btn-text"><b>شروع فرار</b><small>START ESCAPE</small></span>
          </button>
          <div class="cards">
            <button id="board" class="card"><span class="card-ico" data-icon="trophy"></span><b>جدول رکوردها</b></button>
            <button id="daily-play" class="card"><i class="badge">!</i><span class="card-ico" data-icon="calendar"></span><b>چالش روزانه</b></button>
            <button id="settings" class="card"><span class="card-ico" data-icon="gear"></span><b>تنظیمات</b></button>
          </div>
          <footer class="status-row">
            <small id="online-state" class="chip chip-status">در حال بررسی اتصال…</small>
            <small class="ver">v1.2 · SIM 1.1.0</small>
          </footer>
        </div>
      </section>

      <!-- RESULTS -->
      <section id="results" class="screen results hidden">
        <header class="brand brand-small">
          <h1 class="logo"><img src="./assets/logo.svg" alt="ESCAPE 60" width="182" height="112"></h1>
          <p class="ribbon" id="result-tag">RUN COMPLETE</p>
        </header>
        <div class="panel result-panel">
          <div class="title-ribbon">
            <span class="ti" data-icon="trophy"></span><h2 id="result-title">فرار کردی!</h2><span class="ti" data-icon="trophy"></span>
          </div>
          <p class="time-label"><span data-icon="stopwatch"></span>زمان بقا</p>
          <div class="time-row">
            <span class="laurel" data-icon="laurel"></span>
            <div class="result-time" id="result-time">00.00</div>
            <span class="laurel" data-icon="laurel" data-mirror></span>
          </div>
          <p class="status-chip" id="result-status"><span data-icon="check"></span><b>فرار موفق!</b></p>
          <div class="stats">
            <div class="stat"><span class="stat-ico" data-icon="star"></span><small>امتیاز کل</small><strong id="result-score">0</strong></div>
            <div class="stat"><span class="stat-ico" data-icon="drift"></span><small>جاخالی‌ها</small><strong id="result-near">0</strong></div>
            <div class="stat"><span class="stat-ico" data-icon="police"></span><small>برخوردها</small><strong id="result-hits">0</strong></div>
          </div>
          <div class="rank-row"><span data-icon="bars"></span><p class="rank" id="rank">رکورد فقط روی این دستگاه ذخیره شد</p></div>
          <p class="detail" id="result-detail"></p>
          <div class="actions">
            <button id="share" class="btn btn-secondary"><span class="btn-ico" data-icon="share"></span><b>اشتراک رکورد</b></button>
            <button id="replay" class="btn btn-primary"><span class="btn-ico" data-icon="play"></span><b>دوباره بازی کن</b></button>
            <button id="home-button" class="btn btn-secondary"><span class="btn-ico" data-icon="home"></span><b>منوی اصلی</b></button>
          </div>
          <button id="random" class="link"><span data-icon="dice"></span>چالش تصادفی تازه</button>
        </div>
      </section>
    </div>

    <!-- HUD -->
    <header id="hud" class="hud hidden" aria-live="off">
      <div class="hud-top">
        <button aria-label="توقف بازی" id="pause-button" class="hud-pause"><span data-icon="pause"></span></button>
        <div class="hud-timer">
          <b id="time">00.00</b>
          <small>زمان بقا</small>
          <div class="progress" aria-hidden="true"><div id="power"></div></div>
        </div>
        <div class="hud-wanted"><div id="pressure" class="sirens" aria-label="فشار تعقیب"></div><small>تعقیب</small></div>
      </div>
      <div class="hud-bottom">
        <div class="hud-hearts" id="health" aria-label="جان‌های باقی‌مانده"></div>
        <div class="hud-score"><span data-icon="star"></span><b id="score">0</b></div>
      </div>
      <div id="popups" class="popups" aria-hidden="true"></div>
      <div id="banner" class="banner hidden" role="status"></div>
      <div id="countdown" class="countdown hidden" aria-live="assertive"></div>
    </header>
    <nav id="controls" class="controls hidden" aria-label="فرمان ماشین">
      <button id="right" class="steer" aria-label="فرمان راست"><span data-icon="arrowL" data-mirror></span></button>
      <div class="center-hint"><b id="count">60</b><small>تا فرار</small></div>
      <button id="left" class="steer" aria-label="فرمان چپ"><span data-icon="arrowL"></span></button>
    </nav>

    <!-- PAUSE -->
    <section id="pause" class="pause-overlay hidden">
      <div class="panel pause-card">
        <p class="ribbon">PAUSED</p>
        <h2>توقف بازی</h2>
        <p>برای ادامه آماده‌ای؟</p>
        <button id="resume" class="btn btn-primary"><span class="btn-ico" data-icon="play"></span><b>ادامه بازی</b></button>
        <button id="quit" class="btn btn-secondary"><span class="btn-ico" data-icon="home"></span><b>برگشت به منو</b></button>
      </div>
    </section>

    <dialog id="config" class="panel">
      <h2><span data-icon="gear"></span>تنظیمات</h2>
      <button id="sound" class="toggle-row" aria-pressed="false"><span data-icon="mute" id="sound-ico"></span><b id="sound-label">صدا خاموش</b></button>
      <label class="toggle-row"><input id="motion" type="checkbox"><i class="switch"></i><b>کاهش حرکت و لرزش</b></label>
      <label class="toggle-row"><input id="quality" type="checkbox"><i class="switch"></i><b>گرافیک سبک (گوشی ضعیف)</b></label>
      <button id="close-config" class="btn btn-primary"><b>بازگشت</b></button>
    </dialog>
    <dialog id="records" class="panel">
      <h2><span data-icon="trophy"></span>جدول رکوردها</h2>
      <div id="entries" class="entries"></div>
      <button id="close-board" class="btn btn-primary"><b>بازگشت</b></button>
    </dialog>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
